<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Feedback Dashboard — Ubuntu EdTech</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@10..48,400;10..48,500;10..48,700;10..48,800&family=Manrope:wght@300;400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root {
    --night: #0F1923;
    --night2: #18232E;
    --cream: #FAF6EF;
    --sand: #E8E0D4;
    --mid-sand: #9B9183;
    --white: #FFFFFF;
    --ochre: #C17F24;
    --amber: #C47E1A;
    --pink: #A0336A;
    --forest: #1D6B3E;
    --purple: #4B3A8C;
    --red: #E05040;
    --red-light: #FDE8E5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Manrope', sans-serif;
    background: var(--cream);
    color: var(--night);
    line-height: 1.6;
  }

  /* ── GATE ── */
  .gate {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    background: var(--night);
  }
  .gate-box {
    background: var(--cream);
    border-radius: 16px;
    padding: 40px;
    max-width: 380px;
    width: 100%;
    text-align: center;
  }
  .gate-box h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 24px;
    color: var(--night);
    margin-bottom: 4px;
  }
  .gate-box p {
    font-size: 13px;
    color: var(--mid-sand);
    margin-bottom: 24px;
  }
  .gate-box input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid rgba(0,0,0,0.12);
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Manrope', sans-serif;
    margin-bottom: 10px;
    box-sizing: border-box;
    background: white;
  }
  .gate-box input:focus {
    border-color: var(--ochre);
    outline: 2px solid rgba(193,127,36,0.25);
    outline-offset: 1px;
  }
  .gate-box button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: var(--night);
    color: white;
    font-size: 14px;
    font-weight: 500;
    font-family: 'Manrope', sans-serif;
    cursor: pointer;
  }
  .gate-box button:hover { background: var(--night2); }
  .gate-error {
    font-size: 12px;
    color: var(--red);
    margin-top: 8px;
    display: none;
  }

  /* ── DASHBOARD ── */
  .dashboard { display: none; }
  .dash-header {
    background: var(--night);
    color: white;
    padding: 40px 48px 32px;
  }
  .dash-header h1 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 28px;
    margin-bottom: 4px;
  }
  .dash-header p { color: var(--mid-sand); font-size: 14px; }
  .dash-stats {
    display: flex;
    gap: 16px;
    margin-top: 24px;
  }
  .stat-card {
    background: rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 16px 24px;
    flex: 1;
    text-align: center;
  }
  .stat-num {
    font-size: 28px;
    font-weight: 700;
    color: white;
  }
  .stat-label {
    font-size: 11px;
    color: rgba(255,255,255,0.5);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }
  .stat-card.green .stat-num { color: var(--forest); }
  .stat-card.pink .stat-num { color: var(--pink); }

  .dash-body { padding: 32px 48px 64px; max-width: 1200px; }
  .dash-body h2 {
    font-family: 'Bricolage Grotesque', sans-serif;
    font-size: 22px;
    color: var(--night);
    margin-bottom: 20px;
  }

  .section-card {
    background: white;
    border-radius: 12px;
    border: 1px solid rgba(0,0,0,0.06);
    margin-bottom: 16px;
    overflow: hidden;
  }
  .section-card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 20px;
    cursor: pointer;
    transition: background .2s;
  }
  .section-card-header:hover { background: var(--sand); }
  .section-card-header h3 {
    font-size: 15px;
    font-weight: 500;
  }
  .section-badges {
    display: flex;
    gap: 12px;
    align-items: center;
  }
  .badge {
    display: inline-flex; align-items: center; gap: 4px;
    font-size: 12px; font-weight: 500;
    padding: 3px 10px; border-radius: 20px;
  }
  .badge-like { background: rgba(29,107,62,0.1); color: var(--forest); }
  .badge-improve { background: rgba(160,51,106,0.1); color: var(--pink); }
  .badge-count { font-weight: 700; }
  .badge-toggle { font-size: 14px; color: var(--mid-sand); }

  .section-card-body {
    display: none;
    padding: 0 20px 16px;
  }
  .section-card-body.open { display: block; }

  .fb-entry {
    padding: 12px 16px;
    background: var(--sand);
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .fb-entry:last-child { margin-bottom: 0; }
  .fb-entry .fb-text {
    font-size: 14px;
    color: var(--night);
    margin-bottom: 4px;
  }
  .fb-entry .fb-meta {
    font-size: 11px;
    color: var(--mid-sand);
  }
  .fb-entry .fb-meta .name { color: var(--pink); }

  .no-fb {
    font-size: 13px;
    color: var(--mid-sand);
    font-style: italic;
    padding: 8px 0;
  }

  .empty-state {
    text-align: center;
    padding: 60px 20px;
    color: var(--mid-sand);
  }
  .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
  .empty-state h3 { font-family: 'Bricolage Grotesque', sans-serif; font-size: 20px; color: var(--night); margin-bottom: 6px; }

  /* ── SOURCE TABS ── */
  .source-tabs {
    display: flex; gap: 8px; margin-top: 16px;
  }
  .source-tab {
    padding: 6px 16px;
    border-radius: 20px;
    font-size: 12px; font-weight: 500;
    font-family: 'Manrope', sans-serif;
    border: 1px solid rgba(255,255,255,0.2);
    background: transparent;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    transition: all .2s;
  }
  .source-tab:hover { color: white; border-color: rgba(255,255,255,0.4); }
  .source-tab.active {
    background: white; color: var(--night);
    border-color: white;
  }

  /* ── SOURCE BADGE ── */
  .source-badge {
    display: inline-block;
    font-size: 10px; font-weight: 700;
    letter-spacing: 0.06em; text-transform: uppercase;
    padding: 2px 8px; border-radius: 4px;
    font-family: 'Space Mono', monospace;
    margin-right: 6px;
  }
  .source-badge.ue { background: rgba(29,107,62,0.2); color: var(--forest); }
  .source-badge.umu { background: rgba(160,51,106,0.2); color: var(--pink); }

  /* ── DELETE ── */
  .fb-entry { position: relative; }
  .fb-del {
    position: absolute; top: 8px; right: 8px;
    background: none; border: none;
    color: var(--red); cursor: pointer;
    font-size: 14px; opacity: 0.4;
    font-family: 'Manrope', sans-serif;
    padding: 2px 6px; border-radius: 4px;
  }
  .fb-del:hover { opacity: 1; background: var(--red-light); }

  @media (max-width: 768px) {
    .dash-header { padding: 24px 20px; }
    .dash-stats { flex-direction: column; gap: 8px; }
    .dash-body { padding: 20px; }
    .section-card-header { flex-wrap: wrap; gap: 8px; }
  }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="gate" id="gate">
  <div class="gate-box" id="gateBox">
    <div id="gateLoading" style="text-align:center;padding:20px 0">
      <p style="color:var(--mid-sand)">Checking authentication...</p>
    </div>
    <div id="gateForm" style="display:none">
      <h1>Feedback Dashboard</h1>
      <p>Sign in with your admin account.</p>
      <form id="loginForm" onsubmit="signIn(event)">
        <input type="email" id="emailInput" placeholder="Email" required>
        <input type="password" id="passInput" placeholder="Password" required>
        <button type="submit" id="loginBtn">Sign In</button>
      </form>
      <div class="gate-error" id="gateError" style="display:none">Incorrect email or password.</div>
    </div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="dashboard" id="dashboard">
  <div class="dash-header">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
      <div>
        <h1>Feedback Dashboard</h1>
        <p>Feedback Dashboard — Combined View</p>
      </div>
      <button onclick="signOut()" style="background:rgba(255,255,255,0.1);color:white;border:1px solid rgba(255,255,255,0.2);border-radius:8px;padding:8px 16px;font-size:12px;cursor:pointer;font-family:'Manrope',sans-serif">Sign Out</button>
    </div>
    <div class="source-tabs" id="sourceTabs">
      <button class="source-tab active" onclick="setSource('all')">All Sources</button>
      <button class="source-tab" onclick="setSource('ubuntu-edtech')">🌍 Ubuntu EdTech</button>
      <button class="source-tab" onclick="setSource('umu')">🌸 UMU</button>
    </div>
    <div class="dash-stats" id="stats"></div>
  </div>
  <div class="dash-body" id="body"></div>
</div>

<script>
  var SUPABASE_URL = 'https://srpiijgniyvlzfktaaie.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNycGlpamduaXl2bHpma3RhYWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgzMTQ1NTUsImV4cCI6MjA5Mzg5MDU1NX0.wim65uvYr-j12iFo_sha_GDR2kBqsKG7c1pVxAC1tL8';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  sb.auth.getSession().then(function(res) {
    if (res.data.session) {
      showDashboard();
    } else {
      document.getElementById('gateLoading').style.display = 'none';
      document.getElementById('gateForm').style.display = 'block';
    }
  });

  function signIn(e) {
    e.preventDefault();
    var btn = document.getElementById('loginBtn');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    sb.auth.signInWithPassword({
      email: document.getElementById('emailInput').value,
      password: document.getElementById('passInput').value
    }).then(function(res) {
      if (res.error) {
        document.getElementById('gateError').style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In';
      } else {
        showDashboard();
      }
    });
  }

  function signOut() {
    sb.auth.signOut().then(function() {
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('gateLoading').style.display = 'none';
      document.getElementById('gateForm').style.display = 'block';
      document.getElementById('loginForm').reset();
      document.getElementById('loginBtn').disabled = false;
      document.getElementById('loginBtn').textContent = 'Sign In';
      document.getElementById('gate').style.display = 'flex';
    });
  }

  var currentSource = 'all';
  var allData = [];

  function showDashboard() {
    document.getElementById('gate').style.display = 'none';
    document.getElementById('dashboard').style.display = 'block';
    loadDashboard();
  }

  function loadDashboard() {
    sb.from('feedback').select('*').order('created_at', { ascending: false }).then(function(res) {
      if (res.error) { document.getElementById('body').innerHTML = '<p style="color:var(--red)">Error loading feedback.</p>'; return; }
      allData = res.data;
      render();
    });
  }

  function setSource(src) {
    currentSource = src;
    document.querySelectorAll('.source-tab').forEach(function(t) {
      t.classList.toggle('active', t.getAttribute('onclick').includes("'" + src + "'"));
    });
    render();
  }

  function render() {
    var data = currentSource === 'all' ? allData : allData.filter(function(d) { return d.source === currentSource; });
    var total = data.length;
    var likes = data.filter(function(d) { return d.reaction === 'thumbs_up'; }).length;
    var improves = data.filter(function(d) { return d.reaction === 'could_be_better'; }).length;

    document.getElementById('stats').innerHTML =
      '<div class="stat-card"><div class="stat-num">' + total + '</div><div class="stat-label">Total Reactions</div></div>' +
      '<div class="stat-card green"><div class="stat-num">' + likes + '</div><div class="stat-label">Thumbs Up</div></div>' +
      '<div class="stat-card pink"><div class="stat-num">' + improves + '</div><div class="stat-label">Could Be Better</div></div>';

    var sections = {};
    var sectionOrder = [
      '01 · Executive Summary',
      '02 · Competitor Landscape',
      '03 · Strategic Positioning',
      '04 · CSR Programmes',
      '05 · Website & Platform Blueprint',
      '06 · Design Direction',
      '07 · Build Roadmap',
      '08 · Closing',
      'General Feedback'
    ];

    data.forEach(function(d) {
      var s = d.section || 'Unknown';
      if (!sections[s]) sections[s] = { likes: 0, feedbacks: [] };
      if (d.reaction === 'thumbs_up') sections[s].likes++;
      else if (d.reaction === 'could_be_better') sections[s].feedbacks.push(d);
    });

    var html = '<h2>Feedback by Section</h2>';
    var shown = {};

    sectionOrder.forEach(function(name) {
      if (!sections[name]) {
        html += renderSection(name, 0, []);
        return;
      }
      shown[name] = true;
      html += renderSection(name, sections[name].likes, sections[name].feedbacks);
    });

    Object.keys(sections).forEach(function(name) {
      if (!shown[name]) html += renderSection(name, sections[name].likes, sections[name].feedbacks);
    });

    if (total === 0) {
      html = '<div class="empty-state"><div class="icon">📭</div><h3>No Feedback Yet</h3><p>Share the brief with your team and feedback will appear here.</p></div>';
    }

    document.getElementById('body').innerHTML = html;
  }

  function renderSection(name, likes, feedbacks) {
    return '<div class="section-card">' +
      '<div class="section-card-header" onclick="toggleSection(this)">' +
        '<h3>' + name + '</h3>' +
        '<div class="section-badges">' +
          '<span class="badge badge-like">👍 <span class="badge-count">' + likes + '</span></span>' +
          '<span class="badge badge-improve">💡 <span class="badge-count">' + feedbacks.length + '</span></span>' +
          '<span class="badge-toggle">▼</span>' +
        '</div>' +
      '</div>' +
      '<div class="section-card-body">' + renderFeedbacks(feedbacks) + '</div>' +
    '</div>';
  }

  function renderFeedbacks(list) {
    if (list.length === 0) return '<div class="no-fb">No improvement feedback yet.</div>';
    return list.map(function(f) {
      var meta = new Date(f.created_at).toLocaleString();
      var nameStr = '';
      if (f.name) nameStr = f.name;
      else if (f.email) nameStr = f.email;
      if (nameStr) meta = '<span class="name">' + escapeHtml(nameStr) + '</span> · ' + meta;

      var srcBadge = '';
      if (f.source === 'ubuntu-edtech') srcBadge = '<span class="source-badge ue">Ubuntu EdTech</span>';
      else if (f.source === 'umu') srcBadge = '<span class="source-badge umu">UMU</span>';

      return '<div class="fb-entry" data-id="' + f.id + '">' +
        '<button class="fb-del" onclick="deleteFeedback(' + f.id + ', this)" title="Delete">✕</button>' +
        '<div class="fb-text">' + escapeHtml(f.feedback || '(no text)') + '</div>' +
        '<div class="fb-meta">' + srcBadge + meta + '</div></div>';
    }).join('');
  }

  function toggleSection(header) {
    var body = header.nextElementSibling;
    body.classList.toggle('open');
    var toggle = header.querySelector('.badge-toggle');
    toggle.textContent = body.classList.contains('open') ? '▲' : '▼';
  }

  function deleteFeedback(id, btn) {
    if (!confirm('Delete this feedback entry?')) return;
    sb.from('feedback').delete().eq('id', id).then(function(res) {
      if (res.error) { alert('Error deleting: ' + res.error.message); return; }
      var entry = btn.closest('.fb-entry');
      entry.style.opacity = '0';
      entry.style.transform = 'translateX(20px)';
      entry.style.transition = 'all .3s';
      setTimeout(function() { loadDashboard(); }, 300);
    });
  }

  function escapeHtml(s) {
    if (!s) return '';
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  if (window.location.hash && window.location.hash.length > 1) {
    var hashPass = decodeURIComponent(window.location.hash.slice(1));
    document.getElementById('passInput').value = hashPass;
    checkPass();
  }
</script>
</body>
</html>
